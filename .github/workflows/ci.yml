name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Content tests (categories, images, CMS config)
        run: npm run test:content

      - name: Push worker tests (encryption, VAPID signing, cleanup)
        run: npm run test:worker

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build-output tests (SEO tags, sitemap, pagination)
        run: npm run test:build
