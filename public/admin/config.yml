# Use DecapBridge classic auth with your explicit site token routing mapping
backend:
  name: git-gateway
  repo: baalebos-cloud/townscribe
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/95458850-880f-4740-8e26-715c035f3ed4/pkce
  auth_token_endpoint: /sites/95458850-880f-4740-8e26-715c035f3ed4/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: /townscribe-img.jpg
site_url: https://townscribe.org
publish_mode: editorial_workflow

# New uploads go to their own folder instead of the root of public/.
# Images uploaded before this change stay where they are and keep working.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Keep article URLs plain ASCII (drops curly quotes, dashes and accents from slugs)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "News Articles"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
        hint: "Write your article headline here."

      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }

      - { label: "Author Name", name: "author", widget: "string", default: "TownScribe Staff", hint: "Type your name as it should appear on the article" }
      - { label: "Author Role", name: "authorRole", widget: "select", options: ["Admin", "Writer", "Contributor"], default: "Writer" }

      - label: "Category"
        name: "category"
        widget: "select"
        default: "news"
        hint: "Keep this list in sync with src/categories.ts (the build checks it)."
        options:
          - { label: "News", value: "news" }
          - { label: "Politics", value: "politics" }
          - { label: "Governance", value: "governance" }
          - { label: "Crime", value: "crime" }
          - { label: "Business", value: "business" }
          - { label: "World", value: "world" }
          - { label: "Sport", value: "sport" }
          - { label: "Entertainment", value: "entertainment" }
          - { label: "Lifestyle", value: "lifestyle" }
          - { label: "Health", value: "health" }
          - { label: "Technology", value: "technology" }
          - { label: "Articles", value: "articles" }
          - { label: "Pidgin News", value: "pidgin-news" }
          - { label: "Job", value: "job" }

      - { label: "Breaking news", name: "breaking", widget: "boolean", default: false, required: false, hint: "Turn ON only for urgent stories: shows a red BREAKING strip at the top of the homepage for 48 hours." }

      - { label: "Hero Image", name: "heroImage", widget: "image", required: false, default: "/townscribe-img.jpg", choose_url: true }

      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: false
        add_to_top: false
        summary: "{{fields.image}}"
        hint: "Optional. Click 'Add Gallery Images' once per photo to attach as many extra pictures as you need; they appear as a gallery under the article."
        field: { label: "Image", name: "image", widget: "image", choose_url: true }

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Readability Rule: Write crisp paragraphs (target ~18 words), lead with active verbs, and inject clear transition phrases."

      # ✅ Fixed: added space after dash
      - { label: "YouTube Video URL", name: "youtubeUrl", widget: "string", required: false, hint: "Paste the full YouTube link here" }

      - { label: "---- SEO META CONSOLE ----", name: "seo_divider", widget: "hidden", default: "" }

      - { label: "SEO Focus Keyword", name: "seoKeyword", widget: "string", required: true, hint: "Mandatory: The primary search phrase you want this article to rank for." }

      - label: "SEO Meta Title"
        name: "seoTitle"
        widget: "string"
        required: true
        pattern: ['^.{10,200}$', "Optimization Error: Meta title should be a complete thought."]
        hint: "Mandatory: Custom search snippet title."

      - label: "SEO Meta Description"
        name: "seoDescription"
        widget: "string"
        required: true
        max_length: 160
        pattern: ['^.{120,160}$', "Optimization Error: Meta descriptions must be between 120 and 160 characters to fit search screens."]
        hint: "Mandatory: Brief summary between 120 and 160 characters for search engines."

      - label: "🟢 LIVE SEO INDEX STATUS (Type 'PASS' to verify)"
        name: "seo_gatekeeper"
        widget: "string"
        required: true
        pattern: ['^(PASS|pass)$', "INDEX DENIED: Review your Meta Title, Meta Description, Focus Keyword, and Body constraints above. If they are compliant, type 'PASS' to authorize indexing configuration."]
        hint: "Self-Audit Console: Ensure your titles fit character thresholds and your body has transition words. Type PASS when done to greenlight Google indexing."

  # TownScribe TV: short write-up + YouTube video or live stream (shown on /tv and the homepage)
  - name: "tv"
    label: "TV & Live"
    label_singular: "TV / Live post"
    folder: "src/content/tv"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{pubDate}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. LIVE: Town hall meeting on fuel prices" }
      - { label: "Short summary", name: "description", widget: "string", hint: "One or two sentences shown on cards and in search results." }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "YouTube video or live-stream link", name: "youtubeUrl", widget: "string", pattern: ['(youtube\.com|youtu\.be)', "Paste a YouTube link (youtube.com/watch?v=…, youtu.be/…, or youtube.com/live/…)"], hint: "For a live programme, paste the live-stream link from YouTube Studio." }
      - { label: "Live now", name: "isLive", widget: "boolean", default: false, required: false, hint: "Turn ON while the programme is streaming: it plays in full on the site and shows a red LIVE banner on the homepage. Turn OFF when it ends so it becomes a normal 15-second preview." }
      - { label: "Custom thumbnail (optional)", name: "thumbnail", widget: "image", required: false, choose_url: true, hint: "Leave empty to use the YouTube thumbnail." }
      - { label: "Presenter / Author", name: "author", widget: "string", default: "TownScribe TV", required: false }
      - { label: "Write-up", name: "body", widget: "markdown", required: false, hint: "A few paragraphs about the programme." }
