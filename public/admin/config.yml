# Use DecapBridge classic auth with your explicit site token routing mapping
backend:
  name: git-gateway
  repo: baalebos-cloud/townscribe
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/95458850-880f-4740-8e26-715c035f3ed4/pkce
  auth_token_endpoint: /sites/95458850-880f-4740-8e26-715c035f3ed4/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Updated branding logo to your native townscribe image asset
logo_url: /townscribe-img.jpg

# Add site links in Decap CMS (optional)
site_url: https://townscribe.org

# Activates "Editorial Workflow" for a neat Drafts vs Published kanban board layout
publish_mode: editorial_workflow

media_folder: "public" 
public_folder: "/"     

collections:
  - name: "blog"
    label: "News Articles"
    folder: "src/content/blog" # Direct injection path into Astro content directory
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      # --- STRICT 8-WORD HEADLINE ENGINE ---
      - label: "Title"
        name: "title"
        widget: "string"
        pattern: ['^\s*([^\s]+\s+){7}[^\s]+\s*$', "Validation Error: Headline must be EXACTLY 8 words long."]
        hint: "Mandatory: Enter an exact 8-word headline (e.g., 'Local Government Announces New Green Infrastructure Budget')."

      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      
      # --- WRITER & AUTHOR ATTRIBUTION ---
      - { label: "Author Name", name: "author", widget: "string", default: "TownScribe Staff", hint: "Type your name as it should appear on the article" }
      - { label: "Author Role", name: "authorRole", widget: "select", options: ["Admin", "Editor", "Writer", "Contributor"], default: "Writer" }

      # --- AUTOMATED CATEGORIES LINKING BAR ---
      - label: "Category"
        name: "category"
        widget: "select"
        default: "world"
        options:
          - { label: "Politics", value: "politics" }
          - { label: "Business", value: "business" }
          - { label: "Entertainment", value: "entertainment" }
          - { label: "Technology", value: "technology" }
          - { label: "Health", value: "health" }
          - { label: "Sport", value: "sport" }
          - { label: "World", value: "world" }
          - { label: "News", value: "news" }
          - { label: "Job", value: "job" }

      - { label: "Hero Image", name: "heroImage", widget: "image", required: false, default: "/townscribe-img.jpg" }
      
      # --- CONTENT BODY PROSE ENFORCER ---
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Readability Rule: Write crisp paragraphs (target ~18 words), lead with active verbs, and inject clear transition phrases."

      # --- AUTOMATED YOUTUBE REDIRECT TIMELINE ENGINE ---
      - { label: "YouTube Video URL", name: "youtubeUrl", widget: "string", required: false, hint: "Paste the full YouTube link here" }

      # --- ADVANCED SEO CONSOLE ENGINE ---
      - { label: "---- SEO META CONSOLE ----", name: "seo_divider", widget: "hidden", default: "" }
      
      - { label: "SEO Focus Keyword", name: "seoKeyword", widget: "string", required: true, hint: "Mandatory: The primary search phrase you want this article to rank for." }
      
      - label: "SEO Meta Title"
        name: "seoTitle"
        widget: "string"
        required: true
        pattern: ['^.{40,65}$', "Optimization Error: Custom meta title should be between 40 and 65 characters for clean Google snippets."]
        hint: "Mandatory: Custom search snippet title."
      
      - label: "SEO Meta Description"
        name: "seoDescription"
        widget: "text"
        required: true
        pattern: ['^.{120,160}$', "Optimization Error: Meta descriptions must be between 120 and 160 characters to fit search screens."]
        hint: "Mandatory: Brief summary under 160 characters for search engines."
      
      - label: "Search Engine Indexing Control"
        name: "robotsIndex"
        widget: "select"
        default: "index, follow"
        options:
          - { label: "🟢 Index & Follow (Default - Let Google Rank It)", value: "index, follow" }
          - { label: "🔴 Noindex, Nofollow (Hide entirely from Search Engines)", value: "noindex, nofollow" }
